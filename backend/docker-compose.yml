# Имя проекта в Docker (контейнеры, том pgdata) — не зависит от названия папки
name: konok-backend

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: konok
      POSTGRES_PASSWORD: konok
      POSTGRES_DB: konok
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U konok -d konok"]
      interval: 5s
      retries: 10

  # Отдельная БД для тестов: данные в памяти, после перезапуска чистая
  db-test:
    image: postgres:17
    environment:
      POSTGRES_USER: konok
      POSTGRES_PASSWORD: konok
      POSTGRES_DB: konok_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U konok -d konok_test"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
