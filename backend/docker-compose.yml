name: konok-backend

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://konok:konok@db:5432/konok
      REDIS_URL: redis://redis:6379/0
    volumes:
      - storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: konok
      POSTGRES_PASSWORD: konok
      POSTGRES_DB: konok
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U konok -d konok"]
      interval: 5s
      retries: 10

  db-test:
    image: postgres:17
    environment:
      POSTGRES_USER: konok
      POSTGRES_PASSWORD: konok
      POSTGRES_DB: konok_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U konok -d konok_test"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
  storage:
