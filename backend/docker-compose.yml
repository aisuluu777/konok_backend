# Всё приложение: API, фоновый воркер, PostgreSQL, Redis.
#   docker compose up -d --build
# Тестовые БД и Redis для pytest (порты 5433 и 6379 на localhost):
#   docker compose --profile test up -d db-test redis-test

name: konok

x-app: &app
  build: .
  image: konok-backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://konok:${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}@db:5432/konok
    REDIS_URL: redis://redis:6379/0
    STORAGE_DIR: /app/storage
  restart: unless-stopped

services:
  api:
    <<: *app
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - storage:/app/storage  # фото и документы KYC
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    <<: *app
    command: ["arq", "app.worker.WorkerSettings"]
    depends_on:
      api:
        condition: service_healthy  # миграции уже применены

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: konok
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: konok
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U konok -d konok"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]  # refresh-токены переживают перезапуск
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  db-test:
    profiles: ["test"]
    image: postgres:16
    environment:
      POSTGRES_USER: konok
      POSTGRES_PASSWORD: konok
      POSTGRES_DB: konok_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

  redis-test:
    profiles: ["test"]
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
  redisdata:
  storage:
