{% extends "sqladmin/layout.html" %}
{% block content %}
<div class="col-12">
  <div class="card">
    <div class="card-header">
      <h3 class="card-title">Reject KYC #{{ pks }}</h3>
    </div>
    <div class="card-body border-bottom py-3">
      {# GET: кнопки-действия SQLAdmin — GET-маршруты; причина уходит в query. #}
      <form method="GET">
        <input type="hidden" name="pks" value="{{ pks }}">
        <div class="mb-3">
          <label class="form-label" for="reason">Reason</label>
          <textarea class="form-control" id="reason" name="reason" rows="3" maxlength="1000" required></textarea>
        </div>
        <a href="{{ url_for('admin:list', identity='kyc-verification') }}" class="btn">Cancel</a>
        <input type="submit" value="Reject" class="btn btn-danger">
      </form>
    </div>
  </div>
</div>
{% endblock %}
